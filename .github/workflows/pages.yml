name: Deploy expert review app

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "review_app/**"
      - "scripts/test_review_app.py"
      - "data/metadata/eval_questions.csv"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify reviewer application
        run: python scripts/test_review_app.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload reviewer application
        uses: actions/upload-pages-artifact@v5
        with:
          path: review_app

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
